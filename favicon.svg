<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Minimalist luxury background squircle -->
  <rect width="64" height="64" rx="16" fill="#3a2216"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.35"/>

  <!-- Left Ring -->
  <circle cx="26" cy="34" r="12.5" fill="none" stroke="#e6c27a" stroke-width="2.6"/>

  <!-- Right Ring -->
  <circle cx="38" cy="34" r="12.5" fill="none" stroke="#c99b42" stroke-width="2.6"/>

  <!-- Interlocking overlap (left ring passes over at top intersection) -->
  <path d="M 28 22.5 A 12.5 12.5 0 0 1 35 24.5" fill="none" stroke="#e6c27a" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Minimalist diamond sparkle on right ring -->
  <path d="M 38 14 Q 38 18 42 18 Q 38 18 38 22 Q 38 18 34 18 Q 38 18 38 14 Z" fill="#fff8ee"/>
</svg>
